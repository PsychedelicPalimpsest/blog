<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page.title if page else site_title }}{% endblock %}</title>
  <meta name="description" content="{{ page.description if page and page.description else site_description }}">
  <link rel="stylesheet" href="/site.css">
  <script>
    /* apply saved theme before paint to avoid flash */
    (function () {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <header>
    <a href="/">{{ site_title }}</a>
    <nav>
      <a href="/">Home</a>
      <a href="/portfolio/">Portfolio</a>
      <a href="/about/">About</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">&#9788;</button>
    </nav>
  </header>

  <main>
    {% block content %}
    {% if page and page.title %}<h1>{{ page.title }}</h1>{% endif %}
    {{ content | safe }}
    {% endblock %}
  </main>

  <footer>
    Built {{ build_time }}.
  </footer>

  {% if dev_mode %}
  <script>
    (function () {
      try {
        var es = new EventSource('/__reload');
        es.addEventListener('reload', function () { location.reload(); });
        es.onerror = function () { /* EventSource auto-reconnects */ };
      } catch (e) { /* EventSource unsupported */ }
    })();
  </script>
  {% endif %}

  <script>
    (function () {
      var pres = document.querySelectorAll('pre');
      for (var i = 0; i < pres.length; i++) {
        (function (pre) {
          if (pre.parentNode.classList.contains('code-block')) return;

          var wrapper = document.createElement('div');
          wrapper.className = 'code-block';

          var btn = document.createElement('button');
          btn.className = 'copy-btn';
          btn.textContent = 'Copy';
          btn.setAttribute('aria-label', 'Copy code to clipboard');

          btn.onclick = function () {
            var text = pre.textContent || pre.innerText || '';
            var done = function () {
              btn.textContent = 'Copied!';
              setTimeout(function () { btn.textContent = 'Copy'; }, 1500);
            };
            var copy = navigator.clipboard && navigator.clipboard.writeText;
            if (copy) {
              navigator.clipboard.writeText(text).then(done, function () {
                fallback(text, btn, done);
              });
            } else {
              fallback(text, btn, done);
            }
          };

          pre.parentNode.insertBefore(wrapper, pre);
          wrapper.appendChild(btn);
          wrapper.appendChild(pre);
        })(pres[i]);
      }

      function fallback(text, btn, done) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        done();
      }
    })();
  </script>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      var html = document.documentElement;
      var current = html.getAttribute('data-theme') || 'auto';

      function setIcon(mode) {
        btn.innerHTML = mode === 'dark' ? '&#9789;' : '&#9788;';
        btn.title = 'Theme: ' + mode + ' (click to cycle dark / light / auto)';
      }
      setIcon(current);

      function apply(mode) {
        if (mode === 'auto') {
          html.removeAttribute('data-theme');
          localStorage.removeItem('theme');
          setIcon(window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } else {
          html.setAttribute('data-theme', mode);
          localStorage.setItem('theme', mode);
          setIcon(mode);
        }
      }

      btn.onclick = function () {
        var cur = html.getAttribute('data-theme');
        if (!cur) cur = 'auto';
        var next = cur === 'auto' ? 'dark' : cur === 'dark' ? 'light' : 'auto';
        apply(next);
      };

      /* keep icon in sync if OS preference changes while in auto mode */
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!html.getAttribute('data-theme')) setIcon(e.matches ? 'dark' : 'light');
      });
    })();
  </script>
</body>
</html>
