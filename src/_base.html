<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ page.title if page else site_title }}{% endblock %}</title>
  <meta name="description" content="{{ page.description if page and page.description else site_description }}">
  <style>
    :root {
      --fg: #1a1a1a;
      --muted: #666;
      --bg: #fdfdfd;
      --accent: #0066cc;
      --max-width: 42rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ececec;
        --muted: #999;
        --bg: #121212;
        --accent: #66b3ff;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.6;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    main, header, footer {
      width: 100%;
      max-width: var(--max-width);
      padding: 1.5rem 1.25rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
      border-bottom: 1px solid #eee;
    }
    @media (prefers-color-scheme: dark) {
      header { border-bottom-color: #2a2a2a; }
    }
    header a { color: var(--fg); text-decoration: none; font-weight: 600; }
    header nav a { color: var(--muted); margin-left: 1rem; font-weight: 400; }
    header nav a:hover, header nav a:focus { color: var(--accent); }
    main { flex: 1; }
    footer {
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid #eee;
      text-align: center;
    }
    @media (prefers-color-scheme: dark) {
      footer { border-top-color: #2a2a2a; }
    }
    a { color: var(--accent); }
    h1, h2, h3 { line-height: 1.25; }
    h1 { font-size: 1.9rem; margin-top: 0.5rem; }
    h2 { font-size: 1.4rem; margin-top: 2rem; }
    code {
      background: rgba(127,127,127,0.12);
      padding: 0.1em 0.35em;
      border-radius: 3px;
      font-size: 0.92em;
    }
    pre {
      background: rgba(127,127,127,0.10);
      padding: 0.9rem 1rem;
      border-radius: 6px;
      overflow-x: auto;
    }
    pre code { background: transparent; padding: 0; }
    hr { border: none; border-top: 1px solid #eee; margin: 2rem 0; }
    @media (prefers-color-scheme: dark) {
      hr { border-top-color: #2a2a2a; }
    }
    .post-list { list-style: none; padding: 0; }
    .post-list li {
      margin-bottom: 1.25rem;
      display: flex;
      flex-direction: column;
    }
    .post-list .date {
      color: var(--muted);
      font-size: 0.85rem;
    }
    .post-list a {
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
    }
    .post-list a:hover { text-decoration: underline; }
    .post-list p { margin: 0.2rem 0 0; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <a href="/">{{ site_title }}</a>
    <nav>
      <a href="/">Home</a>
      <a href="/portfolio/">Portfolio</a>
      <a href="/about/">About</a>
    </nav>
  </header>

  <main>
    {% block content %}
    {% if page and page.title %}<h1>{{ page.title }}</h1>{% endif %}
    {{ content | safe }}
    {% endblock %}
  </main>

  <footer>
    Built {{ build_time }}.
  </footer>
</body>
</html>
